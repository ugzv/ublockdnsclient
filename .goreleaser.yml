version: 2

project_name: ublockdns

before:
  hooks:
    - go mod download

builds:
  - id: cross
    main: .
    binary: ublockdns
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64

  - id: linux-armv7
    main: .
    binary: ublockdns
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"

  - id: darwin
    main: .
    binary: ublockdns
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: binaries
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: SHA256SUMS

# Two signatures over the checksum manifest. ".vsig" also covers the release
# version and is what current clients verify. ".sig" covers the manifest alone
# and stays published so clients released before ".vsig" can still update.
signs:
  - id: checksum
    cmd: go
    args: ["run", "./scripts/sign", "-in", "${artifact}", "-out", "${signature}"]
    signature: "${artifact}.sig"
    artifacts: checksum

  - id: checksum-version
    cmd: go
    args: ["run", "./scripts/sign", "-in", "${artifact}", "-out", "${signature}", "-version", "{{ .Version }}"]
    signature: "${artifact}.vsig"
    artifacts: checksum

release:
  prerelease: auto
  extra_files:
    - glob: install.sh
    - glob: install.ps1
    - glob: setup.ps1
